[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-toolkit"
version = "0.4.0"
description = "Minimal research toolkit for workflow-run evaluation from enterprise AI agent logs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Bruno Miguel Lopes da Rocha Fernandes" }
]
keywords = ["ai", "agents", "telemetry", "workflow", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = [
  "black>=25.9.0",
  "build>=1.3.0",
  "coverage[toml]>=7.10.0",
  "jsonschema[format]>=4.25.0",
  "matplotlib>=3.10.0",
  "mypy>=1.18.0",
  "ruff>=0.13.0",
  "setuptools>=77.0.0",
  "wheel>=0.45.0"
]

[project.scripts]
agent-eval-toolkit = "agent_eval_toolkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_eval_toolkit = [
  "py.typed",
  "resources/templates/*",
  "resources/docs/*",
]

[tool.setuptools.data-files]
schemas = ["schemas/*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".uv-cache",
  ".uv-test-venv",
  ".venv",
  "build",
  "data/sample_outputs",
  "src/agent_eval_toolkit.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
(
  \.uv-cache
  | \.uv-test-venv
  | \.venv
  | build
  | data/sample_outputs
  | src/agent_eval_toolkit\.egg-info
)
'''

[tool.coverage.run]
branch = true
source = ["agent_eval_toolkit"]
omit = ["*/agent_eval_toolkit/opentelemetry.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.coverage.json]
show_contexts = true
